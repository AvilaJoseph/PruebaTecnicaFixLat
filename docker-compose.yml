# Entorno local completo:  docker compose up -d --build  →  http://localhost:8080
# Funciona sin crear .env: cada variable tiene aquí su valor de demo por defecto
# (para cambiarlos, copia .env.example a .env).

x-database-url: &database-url "postgres://app:${POSTGRES_PASSWORD:-app}@db:5432/portal"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d portal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Tarea de una sola ejecución: aplica las migraciones pendientes (esquema + SeedDemoData) y
  # termina. TypeORM registra cada migración en la tabla "migrations", así que volver a
  # ejecutarla no duplica el esquema ni vuelve a sembrar datos.
  migrate:
    build: ./api
    command: ["npm", "run", "migration:run"]
    environment:
      DATABASE_URL: *database-url
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Usuario123!}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Métricas: la API invoca la Lambda con el SDK de AWS contra el emulador RIE del servicio
      # metrics-lambda. El SDK exige credenciales aunque el RIE no las valida: son ficticias.
      METRICS_FUNCTION_NAME: function
      LAMBDA_ENDPOINT: http://metrics-lambda:8080
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      metrics-lambda:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  # Lambda de métricas en su imagen oficial, que incluye el Runtime Interface Emulator (RIE):
  # se ejecuta en local sin cuenta de AWS. Invocación directa desde el host:
  #   curl -XPOST http://localhost:9000/2015-03-31/functions/function/invocations -d '{}'
  metrics-lambda:
    build: ./lambda/metrics
    restart: unless-stopped
    environment:
      AWS_REGION: us-east-1
      PGHOST: db
      PGPORT: "5432"
      PGUSER: app
      PGPASSWORD: ${POSTGRES_PASSWORD:-app}
      PGDATABASE: portal
    ports:
      - "9000:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
