server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: con proxy_pass variable, el nombre "api" se resuelve en cada petición con el DNS
    # interno de Docker. nginx arranca aunque la API todavía no exista y la URI original
    # (/api/...) se reenvía sin cambios.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recursos con hash generados por Vite: caché larga.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier otra ruta devuelve index.html y React Router decide qué mostrar.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
