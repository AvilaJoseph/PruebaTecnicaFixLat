# Compose de la instancia EC2. Lo ejecuta el UserData de infra/template.yaml desde
# /opt/portal/infra/ec2, con el mismo árbol api/ del commit desplegado.
#
# Mismos Dockerfiles, imágenes y nombres de variables que el docker-compose.yml de la raíz. Cambia:
#   - sin web ni metrics-lambda: el frontend lo sirven S3 + CloudFront y la Lambda es la real;
#   - api publicada en el puerto 80 (origen de /api/* en CloudFront) con COOKIE_SECURE=true;
#   - sin LAMBDA_ENDPOINT ni credenciales: el SDK usa el endpoint real y el rol de la instancia;
#   - db publica 5432 para la Lambda (el security group solo lo abre a la Lambda).
# Los valores llegan en infra/ec2/.env (lo escribe el UserData); los secretos no tienen valor por
# defecto, así que Compose se niega a arrancar si faltan.

x-database-url: &database-url "postgres://app:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@db:5432/portal"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d portal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Igual que en local: aplica migraciones pendientes (esquema + SeedDemoData, una sola vez).
  migrate:
    build: ../../api
    command: ["npm", "run", "migration:run"]
    environment:
      DATABASE_URL: *database-url
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?falta SEED_ADMIN_PASSWORD}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?falta SEED_USER_PASSWORD}
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ../../api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      METRICS_FUNCTION_NAME: ${METRICS_FUNCTION_NAME:?falta METRICS_FUNCTION_NAME}
      AWS_REGION: ${AWS_REGION:?falta AWS_REGION}
    ports:
      - "80:3000"
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

volumes:
  pgdata:
